---
- name: Deploy Ubuntu 24.04 VM via Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    tf_dir: "{{ playbook_dir }}/terraform/ubuntu-deploy"

  tasks:
    - name: Run Terraform Apply
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        force_apply: true
        variables:
          pve_endpoint: "{{ pve_endpoint }}"
          pve_api_token: "{{ pve_api_token }}"
          vm_hostname: "{{ vm_hostname }}"
          cpu_cores: "{{ cpu_cores | default(2) }}"
          memory_mb: "{{ memory_mb | default(2048) }}"
          disk_size_gb: "{{ disk_size_gb | default(20) }}"
          node_name: "{{ node_name | default('host-pve-nagixdtc02') }}"
          storage_id: "{{ storage_id | default('local-lvm') }}"
      register: tf_result

    - name: Display Terraform Output
      ansible.builtin.debug:
        var: tf_result
